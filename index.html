<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Challenger</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/typography.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/animations.css" />
    <style>
      html, body { overflow: hidden; position: fixed; width: 100%; height: 100%; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="loading-screen" style="display:none;"></div>
    <div id="app" style="position:fixed;inset:0;z-index:1;"></div>
    <script>
      window.onerror = function(m) { alert('JS Error: '+m); };
      (function(){
        var v = 'v2.5.35';
        if (sessionStorage.getItem('challenger_ver') && sessionStorage.getItem('challenger_ver') !== v) {
          sessionStorage.setItem('challenger_ver', v);
          location.reload(true);
        } else {
          sessionStorage.setItem('challenger_ver', v);
        }
      })();
      if('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/ellipse/sw.js').then(function(reg) {
          reg.update();
        }).catch(function(){});
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
